<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-label="Highlights: 39 production-grade projects, 92 percent grounded answer accuracy, 0 prompt-injection data changes, 32 infrastructure tests with no AWS account">
  <title>Portfolio highlights</title>
  <style>
    .num { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 34px; font-weight: 800; }
    .lbl { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; fill: #c9d1d9; }
    .sub { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 11px; fill: #8b949e; }
    .card { opacity: 0; animation: rise 0.6s ease forwards; }
    .c1 { animation-delay: 0.1s; } .c2 { animation-delay: 0.35s; } .c3 { animation-delay: 0.6s; } .c4 { animation-delay: 0.85s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ee787"/><stop offset="1" stop-color="#2ea043"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5d6ff"/><stop offset="1" stop-color="#388bfd"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2a8ff"/><stop offset="1" stop-color="#8957e5"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa657"/><stop offset="1" stop-color="#f0883e"/></linearGradient>
  </defs>

  <g class="card c1">
    <rect x="1" y="1" width="178" height="148" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect x="1" y="1" width="178" height="4" rx="2" fill="url(#g1)"/>
    <text x="20" y="62" class="num" fill="url(#g1)">39</text>
    <text x="20" y="90" class="lbl">production-grade</text>
    <text x="20" y="108" class="lbl">projects shipped</text>
    <text x="20" y="133" class="sub">CI green on main</text>
  </g>
  <g class="card c2">
    <rect x="194" y="1" width="178" height="148" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect x="194" y="1" width="178" height="4" rx="2" fill="url(#g2)"/>
    <text x="213" y="62" class="num" fill="url(#g2)">92%</text>
    <text x="213" y="90" class="lbl">grounded answers</text>
    <text x="213" y="108" class="lbl">with citations</text>
    <text x="213" y="133" class="sub">multimodal eval set</text>
  </g>
  <g class="card c3">
    <rect x="387" y="1" width="178" height="148" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect x="387" y="1" width="178" height="4" rx="2" fill="url(#g3)"/>
    <text x="406" y="62" class="num" fill="url(#g3)">0</text>
    <text x="406" y="90" class="lbl">data changes from</text>
    <text x="406" y="108" class="lbl">prompt injection</text>
    <text x="406" y="133" class="sub">even vs. an obeying LLM</text>
  </g>
  <g class="card c4">
    <rect x="580" y="1" width="178" height="148" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect x="580" y="1" width="178" height="4" rx="2" fill="url(#g4)"/>
    <text x="599" y="62" class="num" fill="url(#g4)">32</text>
    <text x="599" y="90" class="lbl">infrastructure tests</text>
    <text x="599" y="108" class="lbl">no AWS account needed</text>
    <text x="599" y="133" class="sub">terraform test + mocks</text>
  </g>
</svg>
